<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foreign X Change | FPS IGNITE XIII</title>
<link rel="icon" href="images/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="forex">
<div id="app-header"></div>
<main>
  <div class="container" style="padding-top:44px;max-width:1040px">
    <div class="row-between" style="align-items:center">
      <a class="back" href="events.html">&larr; All events</a>
      <span id="conn" class="live">Live</span>
    </div>
    <h1 class="title">Foreign X <span class="red">Change</span></h1>

    <div class="card" id="top"><div class="help">Loading...</div></div>

    <div class="card" id="crisiscard" style="display:none">
      <div class="row-between"><div><div class="label gold" id="crisislabel">Global crisis briefing</div><h2 id="crisistitle" style="margin-bottom:12px"></h2></div><span class="timer" id="timer"></span></div>
      <div class="crisisbox" id="cbox"></div>
    </div>

    <div class="fxlayout">
      <div class="fxgrid" id="fxgrid"></div>
      <div class="card" style="margin:0">
        <div class="label gold" style="margin-bottom:10px">Buying prices</div>
        <div class="list" id="prices"></div>
        <div class="help">Buying and selling use the same price. Prices change every round.</div>
      </div>
    </div>

    <div class="card" style="margin-top:18px">
      <div class="label gold">Your activity</div>
      <div class="list" id="acts"></div>
    </div>
    <div class="card" id="stand" style="display:none">
      <div class="label gold" style="margin-bottom:6px">Final standings</div>
      <div class="list" id="standlist"></div>
    </div>
  </div>
</main>
<div id="app-footer"></div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/forex.js"></script>
</body>
</html>
