<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Industry Auction | FPS IGNITE XIII</title>
<link rel="icon" href="images/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="auction">
<div id="app-header"></div>
<main>
  <div class="container" style="padding-top:44px;max-width:760px">
    <div class="row-between" style="align-items:center">
      <a class="back" href="events.html">&larr; All events</a>
      <span id="conn" class="live">Live</span>
    </div>
    <h1 class="title">Industry <span class="red">Auction</span></h1>

    <div class="card" id="mecard"><div class="help">Loading...</div></div>

    <div class="card" id="detail">
      <div id="dhead"></div>
      <div id="dboxes"></div>
      <div id="dnote"></div>
      <div id="dform" style="display:none">
        <div class="amt">
          <input id="amt" placeholder="Enter your bid in ICs" aria-label="Bid amount in ICs">
          <button class="btn" id="bidbtn" type="button">Place bid</button>
          <button class="btn dark" id="wdbtn" type="button" style="display:none">Withdraw</button>
        </div>
        <div class="hint" id="amthint"></div>
      </div>
      <div class="label gold" id="dboardlabel" style="margin-top:22px"></div>
      <div id="dboard"></div>
    </div>

    <div class="card">
      <div class="label gold" style="margin-bottom:6px">All industries</div>
      <div class="list" id="inds"></div>
    </div>
  </div>
</main>
<div id="app-footer"></div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/auction.js"></script>
</body>
</html>
